# The released model: 12,000 updates of 64 questions on an A100 80 GB, fp32 frozen weights.
seed: 0

model:
  name: Qwen/Qwen3-0.6B
  num_layers: 20

data:
  max_train_questions: null
  max_test_questions: 5000
  max_state_tokens: 1024
  max_choice_tokens: 64
  batch_size: 32
  num_workers: 6
  use_answer_prompt: true

synthetic:
  num_questions: 0

calibration:
  fraction: 0.0

lora:
  last_k_layers: 14
  r: 8
  alpha: 16
  dropout: 0.0

head:
  type: posthead
  num_layers: 2
  dropout: 0.1

optim:
  epochs: 1
  lr_lora: 1.0e-4
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  grad_accum_steps: 2
  max_steps: 12000
  rps_weight: 0.0

logging:
  log_every: 20
  eval_every: 1000
  save_every: 500
